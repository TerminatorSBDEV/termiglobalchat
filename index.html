<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO! Ultimate Online Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Outfit:wght@400;600;800&display=swap');

        :root {
            --uno-red: #ff2a4b;
            --uno-blue: #0088ff;
            --uno-green: #00e676;
            --uno-yellow: #ffea00;
            --uno-dark: #0f1026;
            --uno-panel: rgba(20, 24, 56, 0.85);
            --uno-gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka One', cursive, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--uno-dark);
            color: #fff;
        }

        /* Dynamic Animated Background */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main Glassmorphism Overlay UI Container */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Modals & Panels */
        .panel {
            background: var(--uno-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 35px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 15px rgba(255,255,255,0.1);
            text-align: center;
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
            position: relative;
        }

        .panel.active {
            display: block;
            transform: scale(1);
            opacity: 1;
        }

        h1.logo {
            font-size: 3.5rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--uno-yellow), var(--uno-red), var(--uno-blue), var(--uno-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            animation: pulseLogo 3s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1) rotate(-1deg); }
            50% { transform: scale(1.04) rotate(1deg); }
        }

        p.desc {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            color: #b0b8d0;
            margin-bottom: 25px;
            font-size: 1.05rem;
            line-height: 1.4;
        }

        /* Form Controls */
        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: #fff;
            font-size: 1.2rem;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: var(--uno-yellow);
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.4);
        }

        .btn {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 18px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 rgba(0,0,0,0.3);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 11px 0 rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.3);
        }

        .btn-red { background: linear-gradient(180deg, #ff4765, var(--uno-red)); }
        .btn-blue { background: linear-gradient(180deg, #339dff, var(--uno-blue)); }
        .btn-green { background: linear-gradient(180deg, #33eb91, var(--uno-green)); }
        .btn-yellow { background: linear-gradient(180deg, #fff033, var(--uno-yellow)); color: #000; }

        /* Option Selectors */
        .option-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .opt-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .opt-btn.active {
            background: var(--uno-blue);
            border-color: #fff;
            box-shadow: 0 0 10px rgba(0,136,255,0.5);
        }

        /* Server Browser List */
        .server-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
        }

        .server-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .server-item:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Notification Popups */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            background: #ff2a4b;
            color: #fff;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 10px 30px rgba(255,42,75,0.5);
            margin-bottom: 10px;
            animation: slideDown 0.4s ease forwards, fadeOut 0.4s ease 3s forwards;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            text-align: center;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* GAME BOARD CANVAS & UI */
        #game-layout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 5;
        }

        /* Turn Indicator */
        #turn-display {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, var(--uno-yellow), #ff9100);
            color: #000;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(255,234,0,0.6);
            animation: bounceTurn 1s infinite alternate ease-in-out;
            display: none;
            z-index: 20;
        }

        @keyframes bounceTurn {
            from { transform: translate(-50%, -50%) scale(0.95); }
            to { transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Interactive Action Overlay Buttons */
        #game-actions {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .action-btn {
            padding: 12px 28px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #uno-btn {
            background: linear-gradient(135deg, #ff1744, #d50000);
            color: #fff;
            font-size: 1.6rem;
            padding: 10px 35px;
            border: 3px solid #fff;
            box-shadow: 0 0 25px rgba(255,23,68,0.8);
        }

        #skip-btn {
            background: linear-gradient(135deg, var(--uno-blue), #0055ff);
            color: #fff;
        }

        /* CHAT SYSTEM COMPONENT */
        #chat-toggle {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #339dff, var(--uno-blue));
            border: 3px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease;
        }

        #chat-toggle:hover {
            transform: scale(1.1);
        }

        #chat-toggle svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        #chat-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: var(--uno-red);
            border: 2px solid #fff;
            border-radius: 50%;
            display: none;
        }

        #chat-box {
            position: absolute;
            bottom: 95px;
            left: 25px;
            width: 320px;
            height: 380px;
            background: var(--uno-panel);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            z-index: 30;
            transform: scale(0);
            transform-origin: bottom left;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #chat-box.open {
            transform: scale(1);
        }

        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
        }

        .chat-msg {
            background: rgba(255,255,255,0.08);
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .chat-msg.me {
            align-self: flex-end;
            background: var(--uno-blue);
        }

        .chat-msg .author {
            font-size: 0.75rem;
            color: var(--uno-yellow);
            font-family: 'Fredoka One', cursive;
            margin-bottom: 2px;
        }

        .chat-msg.sys {
            align-self: center;
            background: rgba(255, 42, 75, 0.2);
            border: 1px solid var(--uno-red);
            color: #ff8a9e;
            font-size: 0.85rem;
            text-align: center;
        }

        #typing-status {
            padding: 4px 15px;
            font-size: 0.75rem;
            color: #a0aabf;
            font-family: 'Outfit', sans-serif;
            font-style: italic;
            height: 20px;
        }

        #chat-input-area {
            display: flex;
            padding: 10px;
            gap: 8px;
            background: rgba(0,0,0,0.3);
        }

        #chat-input {
            flex: 1;
            margin-bottom: 0;
            padding: 10px 14px;
            font-size: 0.95rem;
            border-radius: 12px;
        }

        #chat-send {
            width: auto;
            padding: 0 16px;
            margin: 0;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        /* Color Selection Wheel Overlay for Wild Cards */
        #color-picker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: none;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            padding: 8px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            z-index: 50;
            animation: popIn 0.3s ease;
        }

        .color-opt {
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .color-opt:hover { transform: scale(1.08); }
        .color-red { background: var(--uno-red); }
        .color-blue { background: var(--uno-blue); }
        .color-green { background: var(--uno-green); }
        .color-yellow { background: var(--uno-yellow); }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="toast-container" id="toast-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        
        <!-- STEP 1: Name Input -->
        <div class="panel interactive" id="panel-name">
            <h1 class="logo">UNO!</h1>
            <p class="desc">Enter your display name to start playing online!</p>
            <input type="text" id="input-username" placeholder="Your Name (3-15 chars)" maxlength="15" autocomplete="off" />
            <button class="btn btn-red" id="btn-save-name">Continue</button>
        </div>

        <!-- STEP 2: Main Menu -->
        <div class="panel interactive" id="panel-menu">
            <h1 class="logo">UNO!</h1>
            <p class="desc">Welcome to UNO! Here you can play with your friends!</p>
            <button class="btn btn-blue" id="btn-menu-create">1 - Create Room</button>
            <button class="btn btn-green" id="btn-menu-join">2 - Join Room</button>
        </div>

        <!-- STEP 3: Create Room Form -->
        <div class="panel interactive" id="panel-create">
            <h1 class="logo">Create Room</h1>
            <input type="text" id="input-room-name" placeholder="Room Name (1-30 chars)" maxlength="30" />
            
            <p class="desc" style="margin-bottom:8px">Max Players:</p>
            <div class="option-group">
                <button class="opt-btn active" data-val="2">2</button>
                <button class="opt-btn" data-val="3">3</button>
                <button class="opt-btn" data-val="4">4</button>
            </div>

            <p class="desc" style="margin-bottom:8px">Visibility:</p>
            <div class="option-group">
                <button class="opt-btn active" id="opt-vis-public">Public</button>
                <button class="opt-btn" id="opt-vis-private">Private</button>
            </div>

            <button class="btn btn-yellow" id="btn-action-create">Launch Lobby</button>
            <button class="btn btn-red" id="btn-back-create" style="background:transparent; box-shadow:none;">Back</button>
        </div>

        <!-- STEP 4: Lobby Waiting Area -->
        <div class="panel interactive" id="panel-lobby">
            <h1 class="logo" id="lobby-title">Waiting...</h1>
            <p class="desc" id="lobby-private-key" style="display:none; color:var(--uno-yellow); font-size:1.3rem;">
                ROOM CODE: <span id="code-display" style="letter-spacing:3px;">------</span>
                <button id="btn-copy-code" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1rem; margin-left:10px;">📋</button>
            </p>
            <p class="desc" id="lobby-count">0/0 Players Connected</p>
            <div class="server-list" id="lobby-player-list" style="max-height:120px;"></div>
            <button class="btn btn-red" id="btn-cancel-lobby">Cancel</button>
        </div>

        <!-- STEP 5: Join Server Browser / Private ID -->
        <div class="panel interactive" id="panel-join">
            <h1 class="logo">Join Room</h1>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <p class="desc" style="margin:0;">Public Rooms:</p>
                <button id="btn-refresh-list" style="background:none; border:none; color:var(--uno-blue); cursor:pointer; font-family:'Outfit';">🔄 Refresh</button>
            </div>
            
            <div class="server-list" id="public-servers">
                <p style="text-align:center; color:#777; padding:15px;">Searching for lobbies...</p>
            </div>

            <p class="desc" style="margin: 15px 0 8px 0;">OR Join Private ID:</p>
            <div style="display:flex; gap:8px;">
                <input type="text" id="input-private-id" placeholder="6-Letter ID" maxlength="6" style="margin:0; text-transform:uppercase;" />
                <button class="btn btn-green" id="btn-join-private" style="width:auto; padding:0 20px; margin:0;">Join</button>
            </div>
            <button class="btn btn-red" id="btn-back-join" style="background:transparent; box-shadow:none; margin-top:10px;">Back</button>
        </div>

    </div>

    <!-- Gameplay Overlay Canvas Layer -->
    <div id="game-layout">
        <canvas id="game-canvas"></canvas>
        
        <div id="turn-display">It's your turn!</div>

        <div id="game-actions">
            <button class="action-btn" id="uno-btn">UNO!</button>
            <button class="action-btn" id="skip-btn">SKIP TURN</button>
        </div>

        <!-- Color Selector for Wild Cards -->
        <div id="color-picker">
            <div class="color-opt color-red" data-color="red"></div>
            <div class="color-opt color-blue" data-color="blue"></div>
            <div class="color-opt color-green" data-color="green"></div>
            <div class="color-opt color-yellow" data-color="yellow"></div>
        </div>

        <!-- Chat Component -->
        <div id="chat-toggle" class="interactive">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            <div id="chat-badge"></div>
        </div>

        <div id="chat-box" class="interactive">
            <div id="chat-messages"></div>
            <div id="typing-status"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Say something..." maxlength="150" autocomplete="off" />
                <button class="btn btn-blue" id="chat-send">Send</button>
            </div>
        </div>
    </div>

    <script>
        /* CONSTANTS & EZBRIDGE CONNECTIONS */
        const TUNNEL_LINK = "https://abs-elements-omissions-cholesterol.trycloudflare.com";
        const AUTH_KEY = "TuoB6PfnWN";

        /* CLIENT STATE */
        let socket = null;
        let localPlayer = { id: '', name: '' };
        let currentRoom = null;
        let gameState = null;
        let selectedMaxPlayers = 2;
        let selectedVisibility = 'Public';
        let typingTimeout = null;
        let isTypingSent = false;
        let lastMessageTime = 0;
        let hoveredCardIndex = -1;
        let floatingNotifs = [];

        /* DOM ELEMENTS */
        const panels = {
            name: document.getElementById('panel-name'),
            menu: document.getElementById('panel-menu'),
            create: document.getElementById('panel-create'),
            lobby: document.getElementById('panel-lobby'),
            join: document.getElementById('panel-join')
        };

        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const gameCanvas = document.getElementById('game-canvas');
        const gameCtx = gameCanvas.getContext('2d');

        /* INITIALIZATION & CANVAS RESIZING */
        function init() {
            resizeCanvases();
            window.addEventListener('resize', resizeCanvases);
            setupBackgroundParticles();
            
            // Check LocalStorage for Saved Name
            const savedName = localStorage.getItem('uno_username');
            if (savedName && savedName.length >= 3 && savedName.length <= 15) {
                localPlayer.name = savedName;
                showPanel('menu');
            } else {
                showPanel('name');
            }

            connectSocket();
            setupEventListeners();
            requestAnimationFrame(renderLoop);
        }

        function resizeCanvases() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            gameCanvas.width = window.innerWidth;
            gameCanvas.height = window.innerHeight;
        }

        /* NAVIGATION HELPER */
        function showPanel(name) {
            Object.keys(panels).forEach(key => {
                panels[key].classList.remove('active');
            });
            if (panels[name]) panels[name].classList.add('active');
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        /* WEBSOCKET NETWORKING */
        function connectSocket() {
            socket = io(TUNNEL_LINK, { auth: { token: "default_key" } });

            socket.on("connect", () => {
                socket.emit("join_virtual_server", { key: AUTH_KEY });
            });

            socket.on("joined_successfully", () => {
                localPlayer.id = socket.id || Math.random().toString(36).substring(2, 9);
            });

            socket.on("RemoteEvent", (pkt) => {
                handleServerEvent(pkt);
            });
        }

        function sendRemote(type, data = {}) {
            if (socket && socket.connected) {
                socket.emit("RemoteEvent", { type, data: { ...data, senderId: localPlayer.id, senderName: localPlayer.name } });
            }
        }

        /* SERVER EVENT ROUTING */
        function handleServerEvent(pkt) {
            const { type, data } = pkt;

            switch (type) {
                case 'room_created':
                case 'room_joined':
                    currentRoom = data.room;
                    setupLobbyUI();
                    showPanel('lobby');
                    break;

                case 'lobby_update':
                    currentRoom = data.room;
                    updateLobbyUI();
                    break;

                case 'public_rooms_list':
                    renderPublicRooms(data.rooms);
                    break;

                case 'error_notif':
                    showToast(data.message);
                    break;

                case 'match_start':
                    document.querySelector('.ui-layer').style.display = 'none';
                    document.getElementById('game-layout').style.display = 'block';
                    startMatchAnimation(data.state);
                    break;

                case 'game_state_update':
                    gameState = data.state;
                    updateGameUI();
                    break;

                case 'chat_message':
                    receiveChatMessage(data);
                    break;

                case 'typing_update':
                    updateTypingDisplay(data.typingUsers);
                    break;

                case 'card_penalized_anim':
                    if (data.targetId === localPlayer.id) {
                        spawnFloatingText(`+${data.count}`, window.innerWidth / 2, window.innerHeight - 100);
                    }
                    break;
            }
        }

        /* UI EVENT HANDLERS */
        function setupEventListeners() {
            // Name Registration
            document.getElementById('btn-save-name').addEventListener('click', () => {
                const val = document.getElementById('input-username').value.trim();
                if (val.length < 3 || val.length > 15) {
                    showToast("Name must be between 3 and 15 characters!");
                    return;
                }
                localPlayer.name = val;
                localStorage.setItem('uno_username', val);
                showPanel('menu');
            });

            // Main Menu
            document.getElementById('btn-menu-create').addEventListener('click', () => showPanel('create'));
            document.getElementById('btn-menu-join').addEventListener('click', () => {
                showPanel('join');
                sendRemote('get_public_rooms');
            });

            // Options Selectors
            document.querySelectorAll('#panel-create .opt-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const parent = e.target.parentElement;
                    parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    if (e.target.dataset.val) {
                        selectedMaxPlayers = parseInt(e.target.dataset.val);
                    } else {
                        selectedVisibility = e.target.innerText;
                    }
                });
            });

            // Create Room Action
            document.getElementById('btn-action-create').addEventListener('click', () => {
                const name = document.getElementById('input-room-name').value.trim();
                if (name.length < 1 || name.length > 30) {
                    showToast("Room name must be 1 to 30 characters!");
                    return;
                }
                sendRemote('create_room', {
                    name,
                    maxPlayers: selectedMaxPlayers,
                    isPrivate: selectedVisibility === 'Private'
                });
            });

            document.getElementById('btn-back-create').addEventListener('click', () => showPanel('menu'));
            document.getElementById('btn-back-join').addEventListener('click', () => showPanel('menu'));

            // Lobby Actions
            document.getElementById('btn-cancel-lobby').addEventListener('click', () => {
                sendRemote('leave_room');
                showPanel('menu');
            });

            document.getElementById('btn-copy-code').addEventListener('click', () => {
                if (currentRoom && currentRoom.code) {
                    navigator.clipboard.writeText(currentRoom.code);
                    showToast("Room Code copied to clipboard!");
                }
            });

            // Join Room Actions
            document.getElementById('btn-refresh-list').addEventListener('click', () => {
                sendRemote('get_public_rooms');
            });

            document.getElementById('btn-join-private').addEventListener('click', () => {
                const code = document.getElementById('input-private-id').value.trim().toUpperCase();
                if (code.length !== 6) {
                    showToast("ERROR:\nthis room is currently not avaiable, please try a different ID, Thank you!");
                    return;
                }
                sendRemote('join_room_by_code', { code });
            });

            // Gameplay Interactions
            document.getElementById('chat-toggle').addEventListener('click', () => {
                const box = document.getElementById('chat-box');
                box.classList.toggle('open');
                document.getElementById('chat-badge').style.display = 'none';
            });

            document.getElementById('chat-send').addEventListener('click', sendChatMessage);
            document.getElementById('chat-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendChatMessage();
                else handleTypingSignal();
            });

            // Card Choice Input (Canvas Clicks)
            gameCanvas.addEventListener('mousemove', handleCanvasHover);
            gameCanvas.addEventListener('click', handleCanvasClick);
            gameCanvas.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) {
                    handleCanvasHover({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
                }
            });

            // Action Buttons
            document.getElementById('uno-btn').addEventListener('click', () => sendRemote('call_uno'));
            document.getElementById('skip-btn').addEventListener('click', () => sendRemote('skip_turn'));

            // Wild Card Color Picker
            document.querySelectorAll('.color-opt').forEach(opt => {
                opt.addEventListener('click', (e) => {
                    const color = e.target.dataset.color;
                    document.getElementById('color-picker').style.display = 'none';
                    if (pendingCardPlay !== null) {
                        sendRemote('play_card', { cardIndex: pendingCardPlay, chosenColor: color });
                        pendingCardPlay = null;
                    }
                });
            });
        }

        /* LOBBY UI MANAGERS */
        function setupLobbyUI() {
            if (!currentRoom) return;
            document.getElementById('lobby-title').innerText = currentRoom.name;
            const keyEl = document.getElementById('lobby-private-key');
            if (currentRoom.isPrivate) {
                keyEl.style.display = 'block';
                document.getElementById('code-display').innerText = currentRoom.code;
            } else {
                keyEl.style.display = 'none';
            }
            updateLobbyUI();
        }

        function updateLobbyUI() {
            if (!currentRoom) return;
            document.getElementById('lobby-count').innerText = `${currentRoom.players.length}/${currentRoom.maxPlayers} Players Connected`;
            const list = document.getElementById('lobby-player-list');
            list.innerHTML = '';
            currentRoom.players.forEach(p => {
                const item = document.createElement('div');
                item.className = 'server-item';
                item.innerHTML = `<span>${p.name}</span> <span style="color:var(--uno-green)">Ready</span>`;
                list.appendChild(item);
            });
        }

        function renderPublicRooms(rooms) {
            const container = document.getElementById('public-servers');
            container.innerHTML = '';
            if (!rooms || rooms.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; padding:15px;">No active public rooms available.</p>';
                return;
            }
            rooms.forEach(room => {
                const item = document.createElement('div');
                item.className = 'server-item';
                item.innerHTML = `
                    <div>
                        <strong>${room.name}</strong>
                        <div style="font-size:0.8rem; color:#aaa;">Host: ${room.hostName}</div>
                    </div>
                    <span>${room.players.length}/${room.maxPlayers}</span>
                `;
                item.addEventListener('click', () => {
                    sendRemote('join_room_by_id', { roomId: room.id });
                });
                container.appendChild(item);
            });
        }

        /* CHAT SYSTEM FRONTEND */
        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            const now = Date.now();

            if (!text) return;
            if (now - lastMessageTime < 500) {
                showToast("Sending messages too fast!");
                return;
            }

            lastMessageTime = now;
            sendRemote('send_chat', { message: text });
            input.value = '';
            sendRemote('typing_status', { isTyping: false });
            isTypingSent = false;
        }

        function handleTypingSignal() {
            if (!isTypingSent) {
                isTypingSent = true;
                sendRemote('typing_status', { isTyping: true });
            }
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isTypingSent = false;
                sendRemote('typing_status', { isTyping: false });
            }, 3000);
        }

        function receiveChatMessage(data) {
            const container = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            
            if (data.isSystem) {
                msg.className = 'chat-msg sys';
                msg.innerText = data.text;
            } else {
                msg.className = `chat-msg ${data.senderId === localPlayer.id ? 'me' : ''}`;
                msg.innerHTML = `<div class="author">${data.senderName}</div>${data.text}`;
            }

            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;

            // Handle Unread Red Badge
            const box = document.getElementById('chat-box');
            if (!box.classList.contains('open') && data.senderId !== localPlayer.id) {
                document.getElementById('chat-badge').style.display = 'block';
            }
        }

        function updateTypingDisplay(users) {
            const status = document.getElementById('typing-status');
            const filtered = users.filter(name => name !== localPlayer.name);
            if (filtered.length === 0) {
                status.innerText = '';
            } else if (filtered.length === 1) {
                status.innerText = `${filtered[0]} is typing...`;
            } else {
                status.innerText = `Several people are typing...`;
            }
        }

        /* GAME VISUALS & ANIMATIONS ENGINE */
        let cardRevealAnim = 0; // Animation timer for initial draw sequence
        let pendingCardPlay = null;

        function startMatchAnimation(initialState) {
            gameState = initialState;
            cardRevealAnim = Date.now();
        }

        function updateGameUI() {
            if (!gameState) return;
            const isMyTurn = gameState.currentTurnId === localPlayer.id;
            const turnDisplay = document.getElementById('turn-display');
            turnDisplay.style.display = isMyTurn ? 'block' : 'none';

            const me = gameState.players.find(p => p.id === localPlayer.id);
            const unoBtn = document.getElementById('uno-btn');
            const skipBtn = document.getElementById('skip-btn');

            // Show UNO button if player has exactly 2 cards
            if (me && me.cards.length === 2 && isMyTurn) {
                unoBtn.style.display = 'block';
            } else {
                unoBtn.style.display = 'none';
            }

            // Show Skip button if drawn card can be played but player chooses to hold
            if (isMyTurn && gameState.canSkipTurn) {
                skipBtn.style.display = 'block';
            } else {
                skipBtn.style.display = 'none';
            }
        }

        function handleCanvasHover(e) {
            if (!gameState) return;
            const me = gameState.players.find(p => p.id === localPlayer.id);
            if (!me) return;

            const cards = me.cards;
            const total = cards.length;
            const cardW = 100;
            const cardH = 150;
            const spacing = Math.min(50, (gameCanvas.width - 200) / total);
            const startX = (gameCanvas.width - ((total - 1) * spacing + cardW)) / 2;
            const startY = gameCanvas.height - 180;

            const mx = e.clientX;
            const my = e.clientY;

            hoveredCardIndex = -1;
            for (let i = total - 1; i >= 0; i--) {
                const x = startX + i * spacing;
                if (mx >= x && mx <= x + cardW && my >= startY && my <= startY + cardH) {
                    hoveredCardIndex = i;
                    break;
                }
            }
        }

        function handleCanvasClick(e) {
            if (!gameState || gameState.currentTurnId !== localPlayer.id) return;
            
            // Check Draw Pile Click
            const deckX = gameCanvas.width / 2 - 120;
            const deckY = gameCanvas.height / 2 - 75;
            if (e.clientX >= deckX && e.clientX <= deckX + 100 && e.clientY >= deckY && e.clientY <= deckY + 150) {
                sendRemote('draw_card');
                return;
            }

            // Check Card Click in Hand
            if (hoveredCardIndex !== -1) {
                const me = gameState.players.find(p => p.id === localPlayer.id);
                const card = me.cards[hoveredCardIndex];
                if (validateCardPlayable(card)) {
                    if (card.color === 'wild') {
                        pendingCardPlay = hoveredCardIndex;
                        document.getElementById('color-picker').style.display = 'grid';
                    } else {
                        sendRemote('play_card', { cardIndex: hoveredCardIndex });
                    }
                } else {
                    showToast("You can't play this card!");
                }
            }
        }

        function validateCardPlayable(card) {
            if (!gameState || !gameState.topCard) return false;
            const top = gameState.topCard;
            if (card.color === 'wild' || card.color === gameState.currentColor) return true;
            if (card.value === top.value) return true;
            return false;
        }

        /* MAIN RENDER LOOP (BACKGROUND & GAMEPLAY) */
        function renderLoop() {
            renderBackground();
            renderGame();
            renderFloatingNotifs();
            requestAnimationFrame(renderLoop);
        }

        // Particle System Background
        let particles = [];
        function setupBackgroundParticles() {
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: Math.random() * 6 + 2,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    color: ['#ff2a4b', '#0088ff', '#00e676', '#ffea00'][Math.floor(Math.random() * 4)]
                });
            }
        }

        function renderBackground() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = bgCanvas.width;
                if (p.x > bgCanvas.width) p.x = 0;
                if (p.y < 0) p.y = bgCanvas.height;
                if (p.y > bgCanvas.height) p.y = 0;

                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = p.color;
                bgCtx.globalAlpha = 0.25;
                bgCtx.fill();
            });
            bgCtx.globalAlpha = 1.0;
        }

        function renderGame() {
            if (!gameState) return;
            gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

            const isMyTurn = gameState.currentTurnId === localPlayer.id;

            // 1. Draw Central Play Area (Deck & Discard Pile)
            const cx = gameCanvas.width / 2;
            const cy = gameCanvas.height / 2;

            // Draw Deck Pile
            drawCard(cx - 120, cy - 75, 100, 150, { isBack: true });

            // Draw Top Discard Card
            if (gameState.topCard) {
                drawCard(cx + 20, cy - 75, 100, 150, gameState.topCard);
            }

            // Draw Current Play Color Ring around Discard
            if (gameState.currentColor) {
                gameCtx.beginPath();
                gameCtx.arc(cx + 70, cy, 90, 0, Math.PI * 2);
                gameCtx.lineWidth = 6;
                gameCtx.strokeStyle = getColorHex(gameState.currentColor);
                gameCtx.stroke();
            }

            // 2. Render Player Hand
            const me = gameState.players.find(p => p.id === localPlayer.id);
            if (me) {
                const cards = me.cards;
                const total = cards.length;
                const cardW = 100;
                const cardH = 150;
                const spacing = Math.min(50, (gameCanvas.width - 200) / total);
                const startX = (gameCanvas.width - ((total - 1) * spacing + cardW)) / 2;
                const startY = gameCanvas.height - 180;

                const animElapsed = (Date.now() - cardRevealAnim) / 1000;
                const isRevealed = animElapsed > 0.5;

                cards.forEach((card, i) => {
                    let x = startX + i * spacing;
                    let y = startY;

                    // Hover Animation: Slide upward and darken other cards
                    const isHovered = hoveredCardIndex === i;
                    if (isHovered) {
                        y -= 25;
                    }

                    const isPlayable = isMyTurn && validateCardPlayable(card);

                    // Draw Card with optional Golden Glow Hinting
                    drawCard(x, y, cardW, cardH, isRevealed ? card : { isBack: true }, {
                        darken: hoveredCardIndex !== -1 && !isHovered,
                        glow: isPlayable
                    });
                });
            }

            // 3. Render Opponents Around Table
            const opponents = gameState.players.filter(p => p.id !== localPlayer.id);
            opponents.forEach((opp, i) => {
                const pos = getOpponentPosition(i, opponents.length);
                
                // Draw Avatar & Status
                gameCtx.fillStyle = gameState.currentTurnId === opp.id ? 'var(--uno-yellow)' : '#fff';
                gameCtx.font = '18px "Fredoka One"';
                gameCtx.textAlign = 'center';
                gameCtx.fillText(`${opp.name} (${opp.cardCount} cards)`, pos.x, pos.y);

                // Draw Opponent Stacked Back Cards
                for (let c = 0; c < Math.min(opp.cardCount, 8); c++) {
                    drawCard(pos.x - 30 + (c * 6), pos.y + 15, 50, 75, { isBack: true });
                }
            });
        }

        function drawCard(x, y, w, h, card, opts = {}) {
            gameCtx.save();
            gameCtx.translate(x, y);

            // Darkening overlay if another card is focused
            if (opts.darken) {
                gameCtx.filter = 'brightness(0.6)';
            }

            // 50% Gold Edge Glow for Playable Hints on Player's Turn
            if (opts.glow) {
                gameCtx.shadowColor = 'gold';
                gameCtx.shadowBlur = 20;
            }

            // Base Card Shape
            gameCtx.fillStyle = card.isBack ? '#1e2440' : getColorHex(card.color);
            gameCtx.beginPath();
            gameCtx.roundRect(0, 0, w, h, 12);
            gameCtx.fill();
            gameCtx.lineWidth = 4;
            gameCtx.strokeStyle = '#fff';
            gameCtx.stroke();

            // Inner Oval Pattern or Back Logo
            if (card.isBack) {
                gameCtx.fillStyle = '#ff2a4b';
                gameCtx.beginPath();
                gameCtx.ellipse(w / 2, h / 2, w * 0.35, h * 0.25, -Math.PI / 6, 0, Math.PI * 2);
                gameCtx.fill();

                gameCtx.fillStyle = 'var(--uno-yellow)';
                gameCtx.font = `${w * 0.22}px "Fredoka One"`;
                gameCtx.textAlign = 'center';
                gameCtx.textBaseline = 'middle';
                gameCtx.fillText('UNO', w / 2, h / 2);
            } else {
                gameCtx.fillStyle = 'rgba(255,255,255,0.2)';
                gameCtx.beginPath();
                gameCtx.ellipse(w / 2, h / 2, w * 0.4, h * 0.3, -Math.PI / 4, 0, Math.PI * 2);
                gameCtx.fill();

                // Card Value Rendering
                gameCtx.fillStyle = '#fff';
                gameCtx.font = `bold ${w * 0.4}px "Fredoka One"`;
                gameCtx.textAlign = 'center';
                gameCtx.textBaseline = 'middle';
                gameCtx.fillText(card.value, w / 2, h / 2);
            }

            gameCtx.restore();
        }

        function getColorHex(color) {
            switch (color) {
                case 'red': return '#ff2a4b';
                case 'blue': return '#0088ff';
                case 'green': return '#00e676';
                case 'yellow': return '#ffea00';
                default: return '#222';
            }
        }

        function getOpponentPosition(index, total) {
            const width = gameCanvas.width;
            const height = gameCanvas.height;

            if (total === 1) return { x: width / 2, y: 80 };
            if (total === 2) {
                return index === 0 ? { x: 150, y: height / 3 } : { x: width - 150, y: height / 3 };
            }
            if (total === 3) {
                if (index === 0) return { x: 150, y: height / 2.5 };
                if (index === 1) return { x: width / 2, y: 80 };
                return { x: width - 150, y: height / 2.5 };
            }
            return { x: width / 2, y: 80 };
        }

        function spawnFloatingText(text, x, y) {
            floatingNotifs.push({ text, x, y, opacity: 1.0, life: 1.0 });
        }

        function renderFloatingNotifs() {
            for (let i = floatingNotifs.length - 1; i >= 0; i--) {
                const n = floatingNotifs[i];
                n.y -= 1.5;
                n.opacity -= 0.02;

                gameCtx.save();
                gameCtx.globalAlpha = Math.max(0, n.opacity);
                gameCtx.fillStyle = 'var(--uno-yellow)';
                gameCtx.font = 'bold 32px "Fredoka One"';
                gameCtx.fillText(n.text, n.x, n.y);
                gameCtx.restore();

                if (n.opacity <= 0) floatingNotifs.splice(i, 1);
            }
        }

        window.onload = init;
    </script>
</body>
</html>
